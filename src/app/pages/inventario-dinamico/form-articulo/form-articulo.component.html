<h2 mat-dialog-title>{{ data.articulo ? 'Editar Elemento' : 'Crear Nuevo Elemento' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="mt-3">

    <div class="d-flex justify-content-between align-items-center mt-3 mb-2">
      <h4 class="m-0 font-medium">Campos Dinámicos</h4>
      <button mat-button color="primary" (click)="addAtributo()">+ Añadir Campo</button>
    </div>

    <div formArrayName="atributos">
      <div *ngFor="let attr of atributos.controls; let i=index" [formGroupName]="i" class="d-flex align-items-center mb-2">
        <mat-form-field appearance="outline" class="w-100 me-2 mb-0">
          <mat-label>Propiedad (Ej: Color)</mat-label>
          <input matInput formControlName="llave">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-100 me-2 mb-0">
          <mat-label>Valor (Ej: Rojo)</mat-label>
          <input matInput formControlName="valor">
        </mat-form-field>
        <button mat-icon-button color="warn" (click)="removeAtributo(i)">
          <i-tabler name="trash" class="icon-18"></i-tabler>
        </button>
      </div>
    </div>
    <div *ngIf="atributos.length === 0" class="text-muted text-sm mt-2">
      No has añadido campos adicionales.
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <div class="text-end mt-4">
      <button mat-button type="button" mat-dialog-close class="me-2">Cancelar</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || guardando" (click)="onSubmit()">
        {{ guardando ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
</mat-dialog-actions>
