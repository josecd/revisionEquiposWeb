<h2 mat-dialog-title>Registrar Movimiento</h2>
<mat-dialog-content>
  <p class="text-muted">Elemento: <strong>{{articuloDisplayName}}</strong></p>
  <p class="text-muted">Stock Actual: <strong>{{articulo.stockActual}}</strong></p>

  <form [formGroup]="form" class="mt-3">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Tipo de Movimiento</mat-label>
      <mat-select formControlName="tipo">
        <mat-option *ngFor="let tipo of tipos" [value]="tipo.value">
          {{ tipo.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="cantidad">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Motivo o Referencia (Opcional)</mat-label>
      <input matInput formControlName="motivo">
    </mat-form-field>

    <mat-divider class="my-3"></mat-divider>
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h4 class="m-0 font-medium">Metadatos (Destino, Usuario, etc.)</h4>
      <button mat-stroked-button color="primary" type="button" (click)="addMetadata()">+ Añadir Campo</button>
    </div>
    
    <div formArrayName="metadata">
      <div *ngFor="let attr of metadata.controls; let i=index" [formGroupName]="i" class="d-flex gap-2 align-items-center mt-2">
        <mat-form-field appearance="outline" class="flex-grow-1 mb-0">
          <mat-label>Ej. Destino</mat-label>
          <input type="text" matInput formControlName="llave" [matAutocomplete]="auto">
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let option of commonKeys" [value]="option">
              {{option}}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>

        <mat-form-field appearance="outline" class="flex-grow-1 mb-0" *ngIf="attr.get('llave')?.value === 'Destino' || attr.get('llave')?.value === 'Hotel'">
          <mat-label>Seleccione el Hotel</mat-label>
          <mat-select formControlName="valor" multiple>
            <mat-option *ngFor="let h of hoteles" [value]="h.nombre || h.id">
              {{h.nombre || h.id}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="flex-grow-1 mb-0" *ngIf="attr.get('llave')?.value !== 'Destino' && attr.get('llave')?.value !== 'Hotel'">
          <mat-label>Ej. Valor</mat-label>
          <input matInput formControlName="valor">
        </mat-form-field>

        <button mat-icon-button color="warn" type="button" (click)="removeMetadata(i)">
          <i-tabler name="trash"></i-tabler>
        </button>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close class="me-2">Cancelar</button>
  <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid || guardando">
    {{ guardando ? 'Guardando...' : 'Guardar Movimiento' }}
  </button>
</mat-dialog-actions>
