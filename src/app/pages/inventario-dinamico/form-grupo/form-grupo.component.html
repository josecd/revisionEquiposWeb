<h2 mat-dialog-title>Nuevo Grupo de Inventario</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="mt-3">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Nombre del Grupo (Ej. Sucursal Centro)</mat-label>
      <input matInput formControlName="nombre" placeholder="Nombre">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Descripción (Opcional)</mat-label>
      <textarea matInput formControlName="descripcion" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">Guardar</button>
</mat-dialog-actions>
